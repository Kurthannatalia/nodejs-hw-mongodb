tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Login user'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: 'Registration email'
            type: string
            format: email
            example: 'test@mail.com'
          password:
            description: "User's password"
            type: string
            example: 'test'
responses:
  '200':
    description: User logged in
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in an user!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  description: 'Access token'
                  type: string
                  example: '4f1a5bb5d88e4576b5442e945db1244c0568f6c88d49e68d430ff348ab56047b'
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
