tags:
  - Auth
summary: Logout user
operationId: logouthUser
description: 'Logout user'
security: []
parameters:
  - name: sessionId
    in: cookie
    required: true
    schema:
      type: string
      example: 67671bb236f6f120cdd1440c
    description: Session ID
responses:
  '204':
    description: User logged out
  '400':
    description: Bad request – Invalid session ID
  '401':
    description: Unauthorized – User not authenticated
